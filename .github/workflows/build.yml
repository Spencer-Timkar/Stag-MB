name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            osx_architectures: "arm64;x86_64"
            cmake_platform: ""
            targets: StagMotionBands_VST3 StagMotionBands_AU StagMotionBands_Standalone StagMotionBandsTests
            verify_universal: true
            artifact: StagMotionBands-macOS-universal
            artifact_formats: AU VST3 Standalone
          - name: macOS Intel
            os: macos-15-intel
            osx_architectures: ""
            cmake_platform: ""
            targets: StagMotionBandsTests
            verify_universal: false
            artifact: ""
            artifact_formats: ""
          - name: Windows x64
            os: windows-latest
            osx_architectures: ""
            cmake_platform: x64
            targets: StagMotionBands_VST3 StagMotionBands_Standalone StagMotionBandsTests
            verify_universal: false
            artifact: StagMotionBands-Windows-x64
            artifact_formats: VST3 Standalone
          - name: Linux x64
            os: ubuntu-24.04
            osx_architectures: ""
            cmake_platform: ""
            targets: StagMotionBands_VST3 StagMotionBands_Standalone StagMotionBandsTests
            verify_universal: false
            artifact: StagMotionBands-Linux-x64
            artifact_formats: VST3 Standalone

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev xvfb xauth

      - name: Configure
        env:
          OSX_ARCHITECTURES: ${{ matrix.osx_architectures }}
          CMAKE_PLATFORM: ${{ matrix.cmake_platform }}
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          if [ -n "$OSX_ARCHITECTURES" ]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCHITECTURES")
          fi
          if [ -n "$CMAKE_PLATFORM" ]; then
            # Visual Studio generator (CMake's default on Windows) for x64.
            args+=(-A "$CMAKE_PLATFORM")
          fi
          cmake "${args[@]}"

      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -o pipefail
          # TARGETS is intentionally word-split into one argument per target.
          cmake --build build --config Release --parallel --target $TARGETS 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E 'error|Error|fatal' build.log | head -n 40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/}"
              echo "::error::${line}"
            done
          fi

      - name: Verify universal binaries
        if: matrix.verify_universal
        run: |
          release=build/StagMotionBands_artefacts/Release
          test_exe=$(find build -type f -name StagMotionBandsTests -perm -u+x -not -path '*/_deps/*' | head -n 1)
          binaries=(
            "$release/AU/Stag Motion Bands.component/Contents/MacOS/Stag Motion Bands"
            "$release/VST3/Stag Motion Bands.vst3/Contents/MacOS/Stag Motion Bands"
            "$release/Standalone/Stag Motion Bands.app/Contents/MacOS/Stag Motion Bands"
            "$test_exe"
          )
          status=0
          for binary in "${binaries[@]}"; do
            if [ -z "$binary" ] || [ ! -f "$binary" ]; then
              echo "::error::Missing binary: ${binary:-StagMotionBandsTests}"
              status=1
              continue
            fi
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            for arch in arm64 x86_64; do
              if [[ " $archs " != *" $arch "* ]]; then
                echo "::error::$binary is missing $arch (has: $archs)"
                status=1
              fi
            done
          done
          exit $status

      - name: Test
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log
          else
            ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log
          fi

      - name: Test x86_64 slice under Rosetta
        if: matrix.verify_universal
        run: |
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            test_exe=$(find build -type f -name StagMotionBandsTests -perm -u+x -not -path '*/_deps/*' | head -n 1)
            set -o pipefail
            /usr/bin/arch -x86_64 "$test_exe" 2>&1 | tee -a test.log
          else
            echo "::warning::Rosetta is not available on this runner; the x86_64 slice was not executed here."
          fi

      - name: Report test failures
        if: failure()
        run: |
          if [ -f test.log ]; then
            failures=$(grep -iE 'fail|error|assert|expected|exception' test.log | head -n 40)
            if [ -z "$failures" ]; then
              failures=$(tail -n 40 test.log)
            fi
            printf '%s\n' "$failures" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/}"
              echo "::error::${line}"
            done
          fi

      - name: Archive bundles
        if: matrix.artifact != ''
        env:
          ARTIFACT: ${{ matrix.artifact }}
          FORMATS: ${{ matrix.artifact_formats }}
        run: |
          read -r -a formats <<< "$FORMATS"
          # Preserve executable bits and symlinks that GitHub's outer ZIP would lose.
          tar -czf "$ARTIFACT.tar.gz" -C build/StagMotionBands_artefacts/Release "${formats[@]}"

      - name: Upload artifact
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
